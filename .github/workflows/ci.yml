name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc 7)
        run: pnpm exec tsc --noEmit -p .
      - name: Lint (next lint)
        run: pnpm lint
      - name: CLI unit tests
        run: pnpm test:cli
      - name: Build (next build)
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright tests (Chromium)
        run: pnpm exec playwright test --project=chromium --reporter=list
